<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Конвертер валют і одиниць</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Конвертер валют і одиниць</h1>
    </header>
    <main>
      <div class="converter-card">
        <section id="type">
          <h2>Тип конвертації</h2>
          <div class="tabs">
            <a href="#currancy" class="tab-link active">Конвертувати валюту</a>
            <a href="#measurment" class="tab-link">Конвертувати одиниці</a>
          </div>
        </section>
        <h2>Форма конвертації</h2>
        <form id="currancy">
          <label for="number-of-currency">Сума: </label>
          <input type="number" id="number-of-currency" />

          <div class="converter-row">
            <label for="from-which-currency">З якої валюти</label>
            <select id="from-which-currency">
              <option>USD</option>
              <option>UAH</option>
              <option>EUR</option>
              <option>GBP</option>
              <option>JPY</option>
            </select>

            <button type="button" class="swap-btn">⇄</button>

            <label for="in-what-currency">В яку валюту</label>
            <select id="in-what-currency">
              <option>USD</option>
              <option>UAH</option>
              <option>EUR</option>
              <option>GBP</option>
              <option>JPY</option>
            </select>
          </div>

          <input type="submit" value="Конвертувати" />
          <label for="result-currancy">Результат: </label>
          <output id="result-currancy"></output>
        </form>
        <form id="measurment">
          <label for="number-of-measurement">Значення: </label>
          <input type="number" id="number-of-measurement" />
          <div class="converter-row">
            <label for="from-which-measurment">З якої величини</label>
            <select id="from-which-measurment">
              <option>cm</option>
              <option>mm</option>
              <option>m</option>
            </select>

            <button type="button" class="swap-btn">⇄</button>

            <label for="in-what-measurments">В яку величину</label>
            <select id="in-what-measurments">
              <option>cm</option>
              <option>mm</option>
              <option>m</option>
            </select>
          </div>

          <input type="submit" value="Конвертувати" />
          <label for="result-measurment">Результат: </label>
          <output id="result-measurment"></output>
        </form>
      </div>
    </main>
    <footer>
      <p>
        Увага: реальний курс при обміні може відрізнятися залежно від вашого
        банку. &copy; 2026
      </p>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
